name: Build BOTW IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf /Applications/Xcode_27.2_Release_Candidate.app
          sudo rm -rf /Applications/Xcode_27.7.app
          sudo rm -rf /Users/runner/Library/Android/sdk
          sudo rm -rf /Users/runner/hostedtoolcache/CodeQL
          echo "=== FREE SPACE AFTER CLEANUP ==="
          df -h /
          echo "=== Disk usage ==="
          df -h /
          for dir in /Applications /opt/homebrew /usr/local /Library/Developer /Users/runner/Library/Developer /Users/runner/Library/Caches; do
            sudo du -sh "$dir" 2>/dev/null || true
          done
          echo "=== Available volumes ==="
          df -h

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          export DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/pip" install lz4 'capstone>=5,<6' fonttools nsz zbic
          df -h /

      - name: Download game
        env:
          GH_TOKEN: ${{ secrets.BOTW_ASSETS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/BOTW" "$RUNNER_TEMP/BOTW_PARTS"

          gh release download botw-input-v1 \
            --repo yunglaver/botw-build-assets \
            --dir "$RUNNER_TEMP/BOTW_PARTS"

          "$RUNNER_TEMP/build-venv/bin/python" - <<'RESTORE'
          from pathlib import Path
          import os

          parts = Path(os.environ["RUNNER_TEMP"]) / "BOTW_PARTS"
          output = Path(os.environ["RUNNER_TEMP"]) / "BOTW"

          names = [
              "The Legend of Zelda Breath of the Wild [01007EF00011E000][v0] (13.48 GB).nsz",
              "The Legend of Zelda Breath of the Wild [01007EF00011E800][v1114112] (0.94 GB).nsz",
              "The Legend of Zelda Breath of the Wild [DLC The Champions Ballad] [01007EF00011F002][v196608].nsp",
              "The Legend of Zelda Breath of the Wild [DLC The Master Trials] [01007EF00011F001][v196608] (1.30 GB).nsz",
          ]

          groups = [
              list(range(0, 7)),
              [7],
              [8],
              [9],
          ]

          for name, indices in zip(names, groups):
              target = output / name
              with target.open("wb") as dest:
                  for i in indices:
                      source = parts / f"botw-part-{i:02d}.bin"
                      assert source.is_file(), f"Missing {source}"
                      with source.open("rb") as inp:
                          while chunk := inp.read(8 * 1024 * 1024):
                              dest.write(chunk)
              print(f"Restored {target.name}: {target.stat().st_size} bytes", flush=True)

          assert len(list(output.iterdir())) == 4
          RESTORE

          rm -rf "$RUNNER_TEMP/BOTW_PARTS"
          df -h /

      - name: Build IPA
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          unset PROD_KEYS
          # Remove downloaded NSZ/NSP only after IPA packaging starts.
          # Extracted RomFS.img, DLC and shaders are preserved.
          (
            for i in $(seq 1 1800); do
              if pgrep -f '[p]ack_ipa.py' >/dev/null; then
                echo "=== IPA PACKING STARTED: FREEING SOURCE ARCHIVES ==="
                find "$RUNNER_TEMP/BOTW" -maxdepth 1 -type f \
                  \( -iname '*.nsz' -o -iname '*.nsp' \) -print -delete
                sync
                df -h /
                exit 0
              fi
              sleep 5
            done
            echo "WARNING: IPA packer was not detected"
          ) &

          "$RUNNER_TEMP/build-venv/bin/python" scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/BOTW" \
            -k "$RUNNER_TEMP/prod.keys" \
            --romfs separate \
            --keep-extracted \
            --progress lines
          rm -f "$RUNNER_TEMP/prod.keys"
          df -h /
          find "$RUNNER_TEMP/BOTW" -maxdepth 1 -name '*.ipa' -ls

      - name: Collect separate RomFS image
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Files after build ==="
          df -h /
          find "$RUNNER_TEMP/BOTW" -type f \( -name '*.ipa' -o -iname 'RomFS.img' \) -exec ls -lh {} \;

          ipa_count=$(find "$RUNNER_TEMP/BOTW" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')
          image_count=$(find "$RUNNER_TEMP/BOTW" -type f -iname 'RomFS.img' | wc -l | tr -d ' ')

          [ "$ipa_count" = 1 ] || { echo "Expected one IPA, found $ipa_count"; exit 1; }
          [ "$image_count" = 1 ] || { echo "Expected one RomFS.img, found $image_count"; exit 1; }

          mkdir -p "$RUNNER_TEMP/OUTPUT"
          ipa=$(find "$RUNNER_TEMP/BOTW" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          image=$(find "$RUNNER_TEMP/BOTW" -type f -iname 'RomFS.img' -print -quit)

          ln "$ipa" "$RUNNER_TEMP/OUTPUT/$(basename "$ipa")"
          ln "$image" "$RUNNER_TEMP/OUTPUT/romfs.img"

          ls -lh "$RUNNER_TEMP/OUTPUT"
          df -h /

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-iPhone-IPA
          path: ${{ runner.temp }}/OUTPUT/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload RomFS
        uses: actions/upload-artifact@v4
        with:
          name: BOTW-RomFS
          path: ${{ runner.temp }}/OUTPUT/romfs.img
          if-no-files-found: error
          retention-days: 1
