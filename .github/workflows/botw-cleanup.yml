name: BOTW cleanup test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: xcode-27
    steps:
      - name: Check cleanup effect
        shell: bash
        run: |
          echo "=== BEFORE ==="
          df -h /
          sudo rm -rf /Applications/Xcode_27.2_Release_Candidate.app
          sudo rm -rf /Applications/Xcode_27.7.app
          echo "=== AFTER ==="
          df -h /
