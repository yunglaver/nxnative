name: BOTW download test

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check available space
        run: df -h /

      - name: Download BOTW from iCloud
        env:
          ICLOUD_LINKS: ${{ secrets.ICLOUD_LINKS }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/icloud-venv
          /tmp/icloud-venv/bin/pip install icloud-resolver
          mkdir -p "$RUNNER_TEMP/BOTW"
          /tmp/icloud-venv/bin/python - <<'PY'
          import os
          import requests
          from pathlib import Path
          from icloud_resolver import resolve_icloud_link

          folder = Path(os.environ["RUNNER_TEMP"]) / "BOTW"
          links = os.environ["ICLOUD_LINKS"].splitlines()

          for link in links:
              if not link.strip():
                  continue
              url, filename = resolve_icloud_link(link.strip())
              target = folder / Path(filename).name
              print("Downloading:", target.name, flush=True)
              with requests.get(url, stream=True, timeout=(30, 180)) as response:
                  response.raise_for_status()
                  with target.open("wb") as output:
                      for chunk in response.iter_content(1024 * 1024):
                          if chunk:
                              output.write(chunk)
              print("Downloaded:", target.name, target.stat().st_size, flush=True)

          assert len(list(folder.iterdir())) == 4, "Expected four BOTW files"
          PY
          ls -lh "$RUNNER_TEMP/BOTW"
          df -h /
